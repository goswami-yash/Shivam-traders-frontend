services:
  shivam-traders-frontend:
    container_name: shivam-traders-frontend

    build:
      context: .
      dockerfile: Dockerfile-pro
      args:
        VITE_API_URL: ${VITE_API_URL}

    ports:
      - "8080:80"

    environment:
      NODE_ENV: production

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    restart: unless-stopped