services:
  vite-dev:
    container_name: shivam-traders-react
    build:
      context: .
      dockerfile: Dockerfile-dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host
    # Optional: depends_on to link to backend API
    # depends_on:
    #   - api


  vite-prod:
    container_name: vite-prod

    build:
      context: .
      dockerfile: Dockerfile-pro
      args:
        VITE_API_URL: ${VITE_API_URL}

    ports:
      - "80:80"

    environment:
      NODE_ENV: production

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
